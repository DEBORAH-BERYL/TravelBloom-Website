<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelBloom</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="nav">
      <h2 class="logo">TravelBloom</h2>
      <nav>
        <a href="#Home">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <main>
      <section id="Home">
        <h1>Explore the World</h1>
        <p>
          Discover beautiful places, cultures, and experiences around the world.
        </p>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search for a destination">
          <button id="searchButton">Search</button>
        </div>
        <div id="searchResult"></div>
        <div id="recommendations">

    <h2>Explore Beautiful Destinations</h2>

    <div class="recommendation-category">
        <h3>Beautiful Beaches</h3>
        <div class="recommendation-images">
            <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=600&q=80" alt="Beautiful ocean waves">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Sunny tropical beach">
        </div>
    </div>

    <div class="recommendation-category">
        <h3>Historic Temples</h3>
        <div class="recommendation-images">
            <img src="https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=600&q=80" alt="Historic temple in India">
            <img src="https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?auto=format&fit=crop&w=600&q=80" alt="Traditional temple architecture">
        </div>
    </div>

    <div class="recommendation-category">
        <h3>Explore Japan</h3>
        <div class="recommendation-images">
            <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=600&q=80" alt="Traditional street in Japan">
            <img src="https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?auto=format&fit=crop&w=600&q=80" alt="Mount Fuji in Japan">
        </div>
    </div>

</div>
        <button id="bookNowButton">Book Now</button>
        <div id="recommendations"></div>
        <div class="social-links">
          <a href="#facebook">Facebook</a>
          <a href="#instagram">Instagram</a>
          <a href="#twitter">Twitter</a>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
